name: BSDK API CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter api build

      - name: Build Docker image
        run: docker build -t bsdk-api .
      
      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      
      - name: Tag Docker image
        if: github.event_name == 'push'
        run: | 
           docker tag bsdk-api:latest ghcr.io/${{github.repository_owner}}/bsdk-api:latest
           docker tag bsdk-api:latest ghcr.io/${{ github.repository_owner }}/bsdk-api:${{ github.sha }}

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
           docker push ghrc.io/${{github.repository_owner}}/bsdk-api:latest
           docker push ghcr.io/${{ github.repository_owner }}/bsdk-api:${{ github.sha }}